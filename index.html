<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>WTP PORTAL</title>

<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1976d2">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-512.png">

<style>

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:linear-gradient(
        135deg,
        #1565c0,
        #26a69a
    );

    font-family:'Segoe UI',sans-serif;
    padding:20px;
}

.login-container{
    width:100%;
    max-width:420px;

    background:#fff;

    padding:35px 25px;

    border-radius:25px;

    box-shadow:
    0 15px 40px rgba(0,0,0,.2);

    text-align:center;
}

.logo{
    width:120px;
    height:120px;
    border

h1{
    margin:0;
    color:#1565c0;
}

p{
    color:#666;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:10px;
    margin-bottom:15px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:14px;

    border:none;
    border-radius:10px;

    background:#1976d2;
    color:white;
    font-weight:bold;
    font-size:16px;

    cursor:pointer;
}

button:hover{
    background:#125ca8;
}

.password-box{
    position:relative;
}

.password-box span{
    position:absolute;
    right:15px;
    top:16px;
    cursor:pointer;
    font-size:20px;
}

</style>

</head>

<script>

if ("serviceWorker" in navigator) {

    window.addEventListener("load", () => {

        navigator.serviceWorker
        .register("sw.js")
        .then(() => {

            console.log("PWA Aktif");

        });

    });

}

</script>

<body>

<div class="login-container">

    <img
      src="icon-512.png"
      class="logo"
      alt="Logo">

    <h1>WTP Portal</h1>

    <p>
      Request Material & Monitoring Stock
    </p>

<div class="password-box">

    <input
     type="password"
     id="password"
     placeholder="Masukkan Password">

    <span onclick="togglePassword()">
      👁️
    </span>

</div>

    <button onclick="login()">
      Login
    </button>

</div>

<script src="js/login.js"></script>

</body>

<script>
 function togglePassword(){

    const pass =
    document.getElementById("password");

    pass.type =
    pass.type === "password"
    ? "text"
    : "password";
}

</script>
</html>
