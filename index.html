<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WTP Portal</title>

<style>

body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#1565c0,#26a69a);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* DASHBOARD */
.container{
    text-align:center;
    color:white;
}

button{
    border:none;
    padding:12px 25px;
    border-radius:12px;
    cursor:pointer;
    background:#fff;
    color:#1565c0;
    font-weight:bold;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:999;
}

.modal-content{
    background:white;
    padding:25px;
    width:90%;
    max-width:400px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.modal-content h2{
    text-align:center;
    margin-bottom:20px;
}

.modal-content input,
.modal-content select{
    width:100%;
    padding:12px;
    margin-bottom:12px;
    border:1px solid #ddd;
    border-radius:10px;
    box-sizing:border-box;
}

.modal-content button{
    width:100%;
    background:#1565c0;
    color:white;
}

.user-card{
    margin-top:20px;
    background:rgba(255,255,255,.15);
    padding:15px;
    border-radius:15px;
}
	
</style>
</head>
<body>

<div class="container">

    <h1>WTP Portal</h1>

    <div class="user-card">
        <h3 id="namaUser">-</h3>
        <p id="deptUser">-</p>
    </div>

    <br>

    <button onclick="gantiUser()">
        Ganti User
    </button>

</div>


<!-- MODAL LOGIN -->

<div class="modal" id="loginModal">

    <div class="modal-content">

        <h2>Identitas Pengguna</h2>

       <input
		    type="text"
		    id="nama"
		    placeholder="Masukkan Nama"
		    style="text-transform: uppercase;">

        <select id="departemen">
            <option value="">Pilih Departemen</option>
            <option>WTP</option>
            <option>CPD/DRP</option>
            <option>MPD/GMD</option>
            <option>WTD</option>
            <option>BOILER</option>
            <option>COP</option>
			<option>HED</option>
        </select>

        <button onclick="simpanUser()">
            Masuk
        </button>

    </div>

</div>


<script>

// cek saat aplikasi dibuka
window.onload = function(){

    const user =
    JSON.parse(localStorage.getItem("userData"));

    if(user){

        window.location.href = "Dashboard.html";

    }else{

        document.getElementById("loginModal")
        .style.display = "flex";

    }

};


// simpan user pertama kali

function simpanUser(){

    const nama =
    document.getElementById("nama").value.trim();

    const departemen =
    document.getElementById("departemen").value;

    if(!nama || !departemen){

        alert("Lengkapi data terlebih dahulu");
        return;

    }

    const data = {
        nama:nama,
        departemen:departemen
    };

    localStorage.setItem(
        "userData",
        JSON.stringify(data)
    );

    // LANGSUNG MASUK DASHBOARD
    window.location.href = "Dashboard.html";

}

// ganti user

function gantiUser(){

    localStorage.removeItem("userData");

    document.getElementById("namaUser")
    .innerText = "-";

    document.getElementById("deptUser")
    .innerText = "-";

    document.getElementById("loginModal")
    .style.display = "flex";

}

</script>

</body>
</html>
