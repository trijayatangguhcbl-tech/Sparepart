<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sparepart Finder</title>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    margin:0;
    padding:20px;
}

.header{
    display:flex;
    gap:10px;
    align-items:center;
    margin-bottom:20px;
}

.header button{
    padding:10px 15px;
    border:none;
    background:#0d6efd;
    color:white;
    border-radius:5px;
    cursor:pointer;
}

#searchInput{
    width:100%;
    padding:12px;
    margin-bottom:20px;
    border:1px solid #ccc;
    border-radius:8px;
}

.card{
    background:white;
    padding:15px;
    margin-bottom:10px;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
}

.card h3{
    margin-top:0;
    color:#0d6efd;
}

.btn{
    padding:8px 12px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    margin-right:5px;
}

.req{
    background:#198754;
    color:white;
}

.fav{
    background:#ffc107;
}

.order{
    background:#fd7e14;
    color:white;
}

.modal{
    display:none;
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.4);
}

.modal-content{
    background:white;
    width:90%;
    max-width:500px;
    margin:50px auto;
    padding:20px;
    border-radius:10px;
}

.modal-content input,
.modal-content textarea{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    border:1px solid #ccc;
    border-radius:5px;
}

</style>

</head>
<body>

<div class="header">
    <button onclick="location.href='order.html'">
        ← back
    </button>

    <h2>Sparepart Finder</h2>
</div>

<input
type="text"
id="searchInput"
placeholder="Cari SAP, Nama Part, Material..."
onkeyup="loadSparepart()">

<div id="result">
Loading Data...
</div>

<script>

const SHEET_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTeEoFLkSsqeUMt1-Twhsy97KTf9VAPEFBZco4ZvOBiZhuUr9kKiqDeolnATfjcsg/pub?gid=1610358830&single=true&output=csv";

const API_URL =
"https://script.google.com/macros/s/AKfycbyvbQfueQVoYBAufWvCPgAmNLU2_3OKrRps_hajOZZEWiw2Dy0u2r_0Miy5kzyXkFax/exec";
	
let sparepartDB = [];


Papa.parse(SHEET_URL,{
    download:true,
    header:true,
    skipEmptyLines:true,

    complete:function(results){

        console.log(results.data);

        sparepartDB = results.data;

        loadSparepart();
    },

    error:function(err){
        console.log(err);
        document.getElementById("result").innerHTML =
        "Gagal membaca Google Sheet";
    }
});

function loadSparepart(){

    let keyword =
    document.getElementById("searchInput")
    .value
    .toLowerCase();

    let html = "";

    let data =
    sparepartDB.filter(item =>
        JSON.stringify(item)
        .toLowerCase()
        .includes(keyword)
    );

    if(data.length===0){

		html=`
		<div class="card">
			<h3>Data tidak ditemukan</h3>

			<button
				class="btn req"
				onclick="openAddForm()">
				+ Tambah Data Baru
			</button>
		</div>
		`;

	}else{

        data.forEach(item=>{

            html+=`

				 <div class="card">

				 <div class="name part">
				 ${item["DESCRIPTION"]||"-"}
				 </div>
				 <b>SAP :</b> ${item["SAP"]||"-"}<br>
				 <b>Program :</b> ${item["PROGRAM"]||"-"}<br>
				 <b>Notes :</b> ${item["NOTES"]||"-"}<br><br>
				
				<button
				class="btn order"
				onclick="addOrder('${item["SAP"]}')">
				Order
				</button>

				<button
				class="btn fav"
				onclick="addFavorite('${item["SAP"]}')">
				Favorit
				</button>

            </div>
            `;
        });
    }

    document.getElementById("result").innerHTML = html;
}


function addFavorite(sap){

    let item =
    sparepartDB.find(x => x["SAP"] === sap);

    let fav =
    JSON.parse(localStorage.getItem("favorite") || "[]");

    let ada =
    fav.find(x => x["SAP"] === sap);

    if(ada){

        alert("Sudah ada di Favorite");
        return;
    }

    fav.push(item);

    localStorage.setItem(
        "favorite",
        JSON.stringify(fav)
    );

    alert("Masuk Favorite");
}
function addOrder(sap){

    let item =
    sparepartDB.find(x => x["SAP"] === sap);

    let order =
    JSON.parse(localStorage.getItem("order") || "[]");

    let existing =
    order.find(x => x["SAP"] === sap);

    if(existing){

        existing.qty =
        (existing.qty || 1) + 1;

    }else{

        item.qty = 1;

        order.push(item);

    }

    localStorage.setItem(
        "order",
        JSON.stringify(order)
    );

    alert("Masuk Order");
}

function openAddForm(){

    document
    .getElementById("addModal")
    .style.display="block";
}

function closeAddForm(){

    document
    .getElementById("addModal")
    .style.display="none";
}

async function saveData(){

    const sap =
    document.getElementById("newSap").value.trim();

    const description =
    document.getElementById("newDesc").value.trim();

    const program =
    document.getElementById("newProgram").value.trim();

    const notes =
    document.getElementById("newNotes").value.trim();

    // VALIDASI WAJIB
    if(!sap){

        alert("SAP wajib diisi");
        document.getElementById("newSap").focus();
        return;
    }

    try{

        const res = await fetch(API_URL,{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                action:"ADD_SPAREPART",

                SAP:SAP,
                DESCRIPTION:DESCRIPTION,
                PROGRAM:PROGRAM,
                NOTES:NOTES

            })

        });

        const result = await res.json();

        if(result.success){

            alert("Data berhasil ditambahkan");

            closeAddForm();

            location.reload();

        }else{

            alert("Gagal menyimpan");
        }

    }catch(err){

        console.error(err);
        alert("Gagal koneksi Apps Script");
    }
}
	
</script>

<div id="addModal" class="modal">

    <div class="modal-content">

        <h3>Input Sparepart Baru</h3>
		<p style="color:red;font-size:12px">
		* SAP wajib diisi
		</p>

        <input
    type="text" id="newSap" placeholder="SAP *" required>
        <input type="text" id="newDesc" placeholder="DESCRIPTION">
        <input type="text" id="newProgram" placeholder="PROGRAM">
        <textarea id="newNotes" placeholder="NOTES"></textarea>

        <br><br>

        <button class="btn req" onclick="saveData()">
            Simpan
        </button>

        <button class="btn" onclick="closeAddForm()">
            Batal
        </button>

    </div>

</div>

</body>
</html>
